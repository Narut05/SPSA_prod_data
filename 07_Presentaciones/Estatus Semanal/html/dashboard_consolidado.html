<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Productividad Consolidado</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: #f4f6fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Elimina por completo cualquier barra de scroll */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .dashboard-container {
            box-sizing: border-box;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            
            /* Ajuste dinámico de contención manteniendo proporción 12.15 : 5.8 */
            width: min(100vw, calc(100vh * (12.15 / 5.8)));
            height: min(100vh, calc(100vw * (5.8 / 12.15)));
            aspect-ratio: 12.15 / 5.8;
        }
        .top-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            flex: 4.2; 
            min-height: 0;
        }
        .top-row .card-chart {
            grid-column: span 3;
        }
        .bottom-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            flex: 5.4; 
            min-height: 0;
        }
        .card {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,.03);
            overflow: hidden;
            display: flex;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="top-row">
            <div class="card"><iframe src="html/kpi_productividad.html"></iframe></div>
            <div class="card card-chart"><iframe src="html/Historico_Productividad.html"></iframe></div>
        </div>
        <div class="bottom-row">
            <div class="card"><iframe src="html/Ranking_GOS.html"></iframe></div>
            <div class="card"><iframe src="html/Ranking_GOR.html"></iframe></div>
            <div class="card"><iframe src="html/Ranking_TiendasTOP.html"></iframe></div>
            <div class="card"><iframe src="html/Ranking_TiendasBOT.html"></iframe></div>
        </div>
    </div>
</body>
</html>
