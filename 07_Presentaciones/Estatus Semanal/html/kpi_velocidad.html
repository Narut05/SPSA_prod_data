<!DOCTYPE html>
    <html>
    <head>
    <meta charset="utf-8">
    <title>VELOCIDAD</title>
    <style>
        body { 
            margin: 0; 
            background: transparent; 
            font-family: Segoe UI, Arial, sans-serif; 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            box-sizing: border-box;
        }
        .card { 
            width: 100%; 
            height: 100%;
            box-sizing: border-box; 
            background: white; 
            padding: 24px; 
            border-top: 4px solid #143c8c; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .titulo { 
            color: #6b7280; 
            font-size: 14px; 
            font-weight: 700; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
        }
        .principal { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-top: 10px; 
        }
        .valor { 
            font-size: 64px; 
            font-weight: 800; 
            color: #13213d; 
            line-height: 1; 
        }
        .dot { 
            width: 16px; 
            height: 16px; 
            border-radius: 50%; 
            background: #16a34a; 
            box-shadow: 0 0 8px #16a34a; 
        }
        hr { 
            border: none; 
            border-top: 1px solid #e5e7eb; 
            margin: 16px 0; 
        }
        .grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 14px; 
            flex-grow: 1;
        }
        .box { 
            border: 1px solid #e5e7eb; 
            border-radius: 12px; 
            padding: 14px; 
            background: #fafafa; 
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .label { 
            font-size: 16px; 
            color: #6b7280; 
            font-weight: 600; 
        }
        .dato { 
            margin-top: 6px; 
            font-size: 24px; 
            font-weight: 700; 
            color: #111827; 
        }
        .badge { 
            display: inline-block; 
            margin-top: 6px; 
            padding: 6px 12px; 
            border-radius: 999px; 
            font-size: 18px; 
            font-weight: 700; 
            text-align: center;
            width: fit-content;
        }
    </style>
    </head>
    <body>
    <div class="card">
        <div>
            <div class="titulo">VELOCIDAD</div>
            <div class="principal">
                <div class="valor">13.3</div>
                <div class="dot"></div>
            </div>
        </div>
        <hr>
        <div class="grid">
            <div class="box"><div class="label">Meta</div><div class="dato">13.8</div></div>
            <div class="box"><div class="label">Cumplimiento</div><div class="badge" style="background:#fef2f2;color:#dc2626;">-4.0%</div></div>
            <div class="box"><div class="label">Año anterior</div><div class="dato">12.7</div></div>
            <div class="box"><div class="label">Variación</div><div class="badge" style="background:#ecfdf5;color:#16a34a;">▲ +4.3%</div></div>
        </div>
    </div>
    </body>
    </html>
